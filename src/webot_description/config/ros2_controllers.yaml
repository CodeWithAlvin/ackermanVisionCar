controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    use_sim_time: true
    reference_timeout: 2.0
    front_steering: true
    open_loop: false
    position_feedback: true
    
    # Joint mapping (Updated for Jazzy)
    traction_joints_names:
      - BL_WHEEL_JOINT
      - BR_WHEEL_JOINT
    steering_joints_names:
      - FL_STEERING_JOINT
      - FR_STEERING_JOINT

    # Kinematics mapping (Updated for Jazzy)
    wheelbase: 0.29502
    steering_track_width: 0.170
    traction_track_width: 0.2186
    traction_wheels_radius: 0.05027

    # Odometry settings
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    publish_rate: 50.0

    # Limits
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        has_acceleration_limits: true
        max_acceleration: 0.5
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.5
        has_acceleration_limits: true
        max_acceleration: 1.0